<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Exhibitions in Finance — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#4a7c6f;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(40,90,75,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Industry Exhibitions in Finance — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T = {id:'root',label:'Industry\nExhibitions\nin Finance',info:'Financial exhibitions and trade fairs are strategic tools for professionals — not just events. They provide intelligence, networking, deal-making, and market positioning opportunities.',children:[
  {id:'A',label:'Strategic\nPurposes',info:'Exhibitions serve four strategic functions beyond showcasing products: gathering market intelligence, developing professional skills, supporting strategic planning, and generating actionable insights.',children:[
    {id:'A1',label:'Strategic\nIntelligence',info:'Observing competitor products, pricing, and positioning at exhibitions builds a competitive intelligence base impossible to acquire from reports alone.'},
    {id:'A2',label:'Professional\nDevelopment',info:'Conferences and panel discussions at exhibitions expose professionals to emerging trends, regulatory shifts, and expert analysis that sharpen their market judgment.'},
    {id:'A3',label:'Strategic\nPlanning',info:'Exhibition data informs long-term decisions: which markets to enter, which technologies to invest in, and which partnerships to pursue.'},
    {id:'A4',label:'Actionable\nInsight',info:'Intelligence gathered at exhibitions must translate into concrete decisions — new product features, revised pricing, adjusted market entry timelines.'},
  ]},
  {id:'B',label:'Types of\nExhibitions',info:'Financial exhibitions fall into three categories based on scope and focus: global events for worldwide trends, regional events for local execution, and specialized forums for niche expertise.',children:[
    {id:'B1',label:'Global\n(e.g., Money20/20)',info:'Global exhibitions like Money20/20 attract thousands of fintech leaders and showcase disruptive technologies, digital assets, AI-driven finance, and global benchmarking data.',children:[
      {id:'B1a',label:'Disruptive\nTechnologies',info:'Blockchain, AI trading systems, and embedded finance platforms that fundamentally reshape how financial services are delivered.'},
      {id:'B1b',label:'Digital Assets',info:'Cryptocurrency infrastructure, tokenization of real-world assets, and central bank digital currency (CBDC) developments showcased for institutional investors.'},
      {id:'B1c',label:'AI-driven Finance',info:'Algorithmic underwriting, automated fraud detection, and AI-powered portfolio management tools presented by leading vendors.'},
      {id:'B1d',label:'Global\nBenchmarking',info:'Comparing firm performance, product features, and technology stacks against global peers to identify competitive gaps.'},
    ]},
    {id:'B2',label:'Regional\n(e.g., FinCore)',info:'Regional exhibitions focus on practical implementation within local regulatory and market contexts, covering market adaptation and regional partnership development.',children:[
      {id:'B2a',label:'Practical\nImplementation',info:'Local adaptations of global technologies — how to implement digital payments or open banking within a specific national regulatory framework.'},
      {id:'B2b',label:'Market\nAdaptation',info:'Adjusting product features, pricing models, and distribution channels to fit regional consumer behavior and competitive dynamics.'},
      {id:'B2c',label:'Local Regulatory\nContext',info:'Understanding national compliance requirements that differ from international standards — tax treatment, data sovereignty, consumer protection rules.'},
      {id:'B2d',label:'Regional\nPartnerships',info:'Building relationships with local banks, fintech startups, payment processors, and regulators who become distribution or compliance partners.'},
    ]},
    {id:'B3',label:'Specialized\nForums',info:'Niche forums focus on specific domains like RegTech and ESG Finance, providing expert-level knowledge and sustainable investment frameworks.',children:[
      {id:'B3a',label:'RegTech &\nCompliance',info:'Technology solutions for regulatory reporting, KYC/AML automation, and compliance monitoring — increasingly mandatory for licensed financial institutions.'},
      {id:'B3b',label:'ESG Finance',info:'Environmental, Social, and Governance investment frameworks, green bond standards, and impact measurement methodologies shaping institutional portfolios.'},
      {id:'B3c',label:'Expert-level\nKnowledge',info:'Deep technical sessions on valuation models, risk frameworks, and derivative structures that require advanced financial expertise.'},
      {id:'B3d',label:'Sustainable\nInvestment',info:'Long-term capital allocation strategies that integrate climate risk, social impact, and governance quality into portfolio construction.'},
    ]},
  ]},
  {id:'C',label:'Professional\nApplication',info:'Turning exhibition attendance into professional value requires three phases: preparation before, structured analysis during, and follow-up to capture outcomes.',children:[
    {id:'C1',label:'Preparation',info:'Effective exhibition attendance starts before the event: setting measurable goals and conducting market research to know what questions to answer.',children:[
      {id:'C1a',label:'Goal Setting',info:'Defining what you want to achieve: identify three competitive threats, find one partnership candidate, gather pricing data on five products.'},
      {id:'C1b',label:'Market Research',info:'Pre-exhibition research on exhibitors, speakers, and agenda topics ensures time is spent on highest-priority contacts and sessions.'},
    ]},
    {id:'C2',label:'Analysis',info:'During and after the exhibition, professionals analyze competitive landscapes, identify emerging economic trends, and refine risk management approaches.',children:[
      {id:'C2a',label:'Competitive\nLandscapes',info:'Mapping competitor product features, pricing tiers, target segments, and technology investments based on observed exhibition presence.'},
      {id:'C2b',label:'Emerging\nEconomic Trends',info:'Identifying macroeconomic and sector-specific shifts — such as rising institutional interest in tokenized assets — that will affect investment decisions.'},
      {id:'C2c',label:'Risk\nManagement',info:'Updating risk frameworks based on newly observed regulatory changes, technology failures reported by peers, or geopolitical risk discussions.'},
    ]},
    {id:'C3',label:'Outcomes',info:'Exhibition intelligence translates into three strategic outcomes: refined investment strategies, improved long-term valuation models, and clearer strategic direction.',children:[
      {id:'C3a',label:'Investment\nStrategies',info:'Revising asset allocation, sector weights, or geographic exposure based on intelligence gathered about where institutional capital is flowing.'},
      {id:'C3b',label:'Long-term\nValuation',info:'Updating discounted cash flow models and comparable company analyses to reflect new technology adoption rates or regulatory costs observed at exhibitions.'},
      {id:'C3c',label:'Strategic\nDirection',info:'Informing board-level decisions about market entry, M&A targets, technology investment, or product line extensions based on exhibition intelligence.'},
    ]},
  ]},
]};

const open=new Set(['root']);
// auto-open L1: add all direct children of root
(T.children||[]).forEach(c=>open.add(c.id));

const ELS={},INFO={};
function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}
const ROW=44,COLW=220,ROOT_X=90;
function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}
function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}
function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}
let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;
function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}
function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}
const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}
function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});
window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
