<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Profession of an Economist — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#7a6040;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(90,65,30,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>The Profession of an Economist — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T = {id:'root',label:'The Profession\nof an Economist',info:'Modern economists combine financial analysis, forecasting, risk assessment, and strategic communication — with English as the essential professional language of global finance.',children:[
  {id:'A',label:'Core\nCompetencies',info:'A modern economist must master four interconnected skills: quantitative analysis, economic forecasting, risk assessment, and clear communication of findings to decision-makers.',children:[
    {id:'A1',label:'Financial\nAnalysis',info:'Interpreting financial statements, calculating ratios, modeling cash flows, and assessing company performance. The foundation of all investment and credit decisions.',children:[
      {id:'A1a',label:'Ratio Analysis',info:'Liquidity ratios (current ratio), profitability ratios (ROE, ROA), leverage ratios (debt-to-equity), and efficiency ratios reveal different dimensions of financial health.'},
      {id:'A1b',label:'Cash Flow\nModeling',info:'Projecting future cash inflows and outflows to assess whether a business can service debt, fund growth, or sustain operations through downturns.'},
    ]},
    {id:'A2',label:'Economic\nForecasting',info:'Using historical data, econometric models, and leading indicators to project GDP growth, inflation, exchange rates, and sector performance for investment decisions.',children:[
      {id:'A2a',label:'Leading\nIndicators',info:'Metrics that predict future economic activity: purchasing manager indices (PMI), yield curve shape, credit spreads, and consumer confidence surveys.'},
      {id:'A2b',label:'Scenario\nAnalysis',info:'Constructing base, optimistic, and pessimistic scenarios for key variables — then stress-testing portfolios or business plans against each scenario.'},
    ]},
    {id:'A3',label:'Risk\nAssessment',info:'Identifying, quantifying, and prioritizing financial, operational, credit, and market risks. Economists advise on hedging strategies and risk mitigation structures.'},
    {id:'A4',label:'Strategic\nCommunication',info:'Translating complex quantitative analysis into clear written reports, executive briefings, and client presentations. Analytical skill is only valuable if effectively communicated.'},
  ]},
  {id:'B',label:'Role of English\nin Finance',info:'English is the operating language of international finance — for reading research, negotiating deals, writing reports, and communicating with global counterparts.',children:[
    {id:'B1',label:'Reading Financial\nReports',info:'Annual reports, IMF publications, Bloomberg analysis, and academic research are published primarily in English. Economists who cannot read them are cut off from global intelligence.',children:[
      {id:'B1a',label:'Annual Reports',info:'Audited financial statements plus management discussion and analysis (MD&A) — the primary source for fundamental analysis of publicly listed companies.'},
      {id:'B1b',label:'Research\nPublications',info:'IMF World Economic Outlook, World Bank reports, central bank minutes, and sell-side equity research require strong English reading comprehension.'},
    ]},
    {id:'B2',label:'Negotiations &\nDeals',info:'Cross-border M&A, syndicated loans, bond issuance, and joint ventures are negotiated in English regardless of the parties\' nationalities.'},
    {id:'B3',label:'Writing\nReports',info:'Investment memoranda, credit committee papers, regulatory submissions, and client reports must be written in clear, precise financial English.'},
    {id:'B4',label:'Career\nAdvancement',info:'Economists with strong English access international employers, higher-paying roles at global banks and funds, and leadership positions in international organizations.'},
  ]},
  {id:'C',label:'Risks of Poor\nAnalysis',info:'Errors in economic analysis carry severe financial consequences — incorrect forecasts, missed risks, and poor communication all lead to measurable losses.',children:[
    {id:'C1',label:'Incorrect\nForecasts',info:'An economist who projects 3% GDP growth when the economy contracts by 1% causes clients or employers to hold the wrong assets at the wrong time — generating losses.'},
    {id:'C2',label:'Missed\nRisks',info:'Failing to identify credit deterioration, liquidity risk, or operational vulnerabilities before they materialize leads to unexpected write-downs and reputational damage.'},
    {id:'C3',label:'Miscommunication',info:'A correct analysis poorly communicated — buried in jargon, unclear structure, or excessive length — fails to influence decisions and provides no value.'},
    {id:'C4',label:'Regulatory\nConsequences',info:'Economists working in compliance or reporting functions face personal liability if their analysis supports decisions that later prove to violate regulations.'},
  ]},
  {id:'D',label:'Career\nPathways',info:'Economics graduates enter diverse financial careers — each requiring a different combination of analytical, quantitative, and communication skills.',children:[
    {id:'D1',label:'Investment\nBanking',info:'Advising on M&A, capital raising, and restructuring. Requires financial modeling, valuation, and deal structuring skills with long working hours and high compensation.'},
    {id:'D2',label:'Asset\nManagement',info:'Managing portfolios of equities, bonds, or alternative assets on behalf of institutional or retail clients. Requires macroeconomic forecasting and security selection skills.'},
    {id:'D3',label:'Central Bank /\nGovernment',info:'Conducting monetary policy analysis, economic research, and regulatory oversight. More stable compensation than private sector but significant policy influence.'},
    {id:'D4',label:'Corporate\nFinance',info:'Working within a company to manage treasury, financial planning and analysis (FP&A), investor relations, and capital structure decisions.'},
  ]},
]};

const open=new Set(['root']);
(T.children||[]).forEach(c=>open.add(c.id));

const ELS={},INFO={};
function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}
const ROW=44,COLW=220,ROOT_X=90;
function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}
function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}
function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}
let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;
function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}
function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}
const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}
function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});
window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
