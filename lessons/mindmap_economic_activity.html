<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Economic Activity — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#4a6b3a;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;overflow:hidden;height:100vh}
#toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:30px;backdrop-filter:blur(8px)}
#toolbar button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:.78rem;font-weight:600;transition:.2s}
#toolbar button:hover{background:rgba(255,255,255,.28)}
#back-btn{position:fixed;top:16px;left:16px;z-index:100;background:rgba(0,0,0,.45);border:none;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:600;backdrop-filter:blur(8px)}
#back-btn:hover{background:rgba(0,0,0,.65)}
#canvas-wrap{width:100vw;height:100vh;overflow:hidden;cursor:grab;user-select:none}
#canvas-wrap.grabbing{cursor:grabbing}
svg{position:absolute;top:0;left:0;pointer-events:none}
.node{position:absolute;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;cursor:pointer;transition:box-shadow .2s,transform .2s;line-height:1.3;padding:6px 10px}
.node:hover{transform:scale(1.04);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.node.root{background:#dce3f5;border:2px solid #a0b0d8;color:#1a2a4a;font-size:.95rem;z-index:10}
.node.l1{background:#c8ddf5;border:2px solid #8ab0d8;color:#1a2a4a;font-size:.82rem}
.node.l2{background:#d4eaf8;border:2px solid #90c0e0;color:#1a2a4a;font-size:.78rem}
.node.l3{background:#c0edd8;border:2px solid #70c0a0;color:#0a2a1a;font-size:.75rem}
.node.collapsed .expand-icon::after{content:'＋'}
.expand-icon{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:.7rem;color:#6080a0;pointer-events:none}
.expand-icon::after{content:''}
line,path{stroke:#90a8c8;stroke-width:1.8;fill:none}
</style>
</head>
<body>
<button id="back-btn" onclick="history.back()">← Back</button>
<div id="toolbar">
  <button onclick="zoom(1.2)">＋ Zoom</button>
  <button onclick="zoom(0.83)">－ Zoom</button>
  <button onclick="resetView()">Reset</button>
  <button onclick="expandAll()">Expand All</button>
  <button onclick="collapseAll()">Collapse All</button>
</div>
<div id="canvas-wrap">
  <svg id="svg"></svg>
  <div id="canvas"></div>
</div>
<script>
const ROW=44, COLW=210, ROOT_X=90, PAD=14;

const TREE={
  id:'root',label:'Economics',children:[
    {id:'def',label:'Definition',children:[
      {id:'def1',label:'Study of resource use'},
      {id:'def2',label:'Production, distribution, consumption'}
    ]},
    {id:'roles',label:'Economic Roles',children:[
      {id:'consumer',label:'Consumer',children:[
        {id:'c1',label:'Buys for personal use'}
      ]},
      {id:'producer',label:'Producer',children:[
        {id:'p1',label:'Makes goods'},
        {id:'p2',label:'Provides services'}
      ]}
    ]},
    {id:'products',label:'Products',children:[
      {id:'cgoods',label:'Consumer Goods',children:[
        {id:'cg1',label:'Perishable (e.g., foodstuffs)'},
        {id:'cg2',label:'Durable (e.g., computers, cars)'}
      ]},
      {id:'services',label:'Services',children:[
        {id:'s1',label:'Actions (e.g., teaching, cleaning)'},
        {id:'s2',label:'Used up when provided'}
      ]}
    ]},
    {id:'resources',label:'Resources',children:[
      {id:'r1',label:'Human (people)'},
      {id:'r2',label:'Natural (raw materials)'},
      {id:'r3',label:'Capital (money or property)'}
    ]},
    {id:'scarcity',label:'Scarcity',children:[
      {id:'sc1',label:'Unlimited human wants'},
      {id:'sc2',label:'Limited resource supply'},
      {id:'sc3',label:'Demand exceeds supply'}
    ]},
    {id:'sectors',label:'Sectors of Activity',children:[
      {id:'se1',label:'Primary: Extraction'},
      {id:'se2',label:'Secondary: Manufacturing'},
      {id:'se3',label:'Tertiary: Services'}
    ]},
    {id:'problems',label:'Basic Economic Problems',children:[
      {id:'bp1',label:'What to produce?'},
      {id:'bp2',label:'How to produce?'},
      {id:'bp3',label:'Who will get products?'},
      {id:'bp4',label:'Timing: Now vs. Future'}
    ]}
  ]
};

const state={collapsed:new Set(),pan:{x:60,y:30},zoom:1,drag:false,last:{x:0,y:0}};

function totalLeaves(node){
  if(!node.children||node.children.length===0||state.collapsed.has(node.id))return 1;
  return node.children.reduce((s,c)=>s+totalLeaves(c),0);
}

function layout(node,depth,rowStart){
  const leaves=totalLeaves(node);
  const cx=ROOT_X+depth*COLW;
  const cy=(rowStart+leaves/2)*ROW;
  node._x=cx; node._y=cy; node._leaves=leaves;
  if(node.children&&!state.collapsed.has(node.id)){
    let r=rowStart;
    node.children.forEach(c=>{layout(c,depth+1,r);r+=totalLeaves(c);});
  }
}

function getLevel(node){
  if(node.id==='root')return'root';
  // find depth
  function depth(n,target,d){
    if(n.id===target)return d;
    if(!n.children)return -1;
    for(const c of n.children){const r=depth(c,target,d+1);if(r>=0)return r;}
    return -1;
  }
  const d=depth(TREE,node.id,0);
  if(d===1)return'l1';
  if(d===2)return'l2';
  return'l3';
}

function render(){
  layout(TREE,0,0);
  const canvas=document.getElementById('canvas');
  const svg=document.getElementById('svg');
  canvas.innerHTML=''; svg.innerHTML='';

  const totalH=totalLeaves(TREE)*ROW+ROW;
  const totalW=ROOT_X+5*COLW+200;
  svg.setAttribute('width',totalW); svg.setAttribute('height',totalH);

  function drawNode(node){
    const div=document.createElement('div');
    div.className='node '+getLevel(node);
    const w=node.id==='root'?110:node._leaves>1||node.children?140:170;
    const h=32;
    div.style.cssText=`left:${node._x-w/2}px;top:${node._y-h/2}px;width:${w}px;min-height:${h}px`;
    div.textContent=node.label;
    if(node.children&&node.children.length){
      const sp=document.createElement('span');
      sp.className='expand-icon';
      if(state.collapsed.has(node.id))sp.textContent='＋';
      div.appendChild(sp);
      div.onclick=e=>{e.stopPropagation();toggle(node.id);};
    }
    canvas.appendChild(div);

    if(node.children&&!state.collapsed.has(node.id)){
      node.children.forEach(c=>{
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        const x1=node._x+(w/2)-5, y1=node._y;
        const cw=node.id==='root'?110:node._leaves>1||node.children?140:170;
        const x2=c._x-(cw/2), y2=c._y;
        const mx=(x1+x2)/2;
        path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
        svg.appendChild(path);
        drawNode(c);
      });
    }
  }
  drawNode(TREE);
  applyTransform();
}

function applyTransform(){
  const c=document.getElementById('canvas');
  const s=document.getElementById('svg');
  const t=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;
  c.style.transform=s.style.transform=t;
  c.style.transformOrigin=s.style.transformOrigin='0 0';
}

function toggle(id){state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);render();}
function zoom(f){state.zoom=Math.min(2.5,Math.max(0.3,state.zoom*f));applyTransform();}
function resetView(){state.pan={x:60,y:30};state.zoom=1;applyTransform();}
function expandAll(){state.collapsed.clear();render();}
function collapseAll(){
  function addAll(n){if(n.children){state.collapsed.add(n.id);n.children.forEach(addAll);}}
  TREE.children.forEach(addAll); render();
}

const wrap=document.getElementById('canvas-wrap');
wrap.addEventListener('mousedown',e=>{state.drag=true;state.last={x:e.clientX,y:e.clientY};wrap.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(!state.drag)return;state.pan.x+=e.clientX-state.last.x;state.pan.y+=e.clientY-state.last.y;state.last={x:e.clientX,y:e.clientY};applyTransform();});
window.addEventListener('mouseup',()=>{state.drag=false;wrap.classList.remove('grabbing');});
wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.9);},{passive:false});
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){state.drag=true;state.last={x:e.touches[0].clientX,y:e.touches[0].clientY};}},{passive:true});
wrap.addEventListener('touchmove',e=>{if(!state.drag||e.touches.length!==1)return;e.preventDefault();state.pan.x+=e.touches[0].clientX-state.last.x;state.pan.y+=e.touches[0].clientY-state.last.y;state.last={x:e.touches[0].clientX,y:e.touches[0].clientY};applyTransform();},{passive:false});
wrap.addEventListener('touchend',()=>{state.drag=false;});

render();
</script>
</body>
</html>
