<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing and Strategy in Financial Organizations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fdf0f5;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(253, 240, 245, 0.92);
    border-bottom: 1px solid #e8c8d4;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(4px);
  }

  #header-title {
    font-size: 11px;
    font-weight: 600;
    color: #6b3a52;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #header-hint {
    font-size: 10px;
    color: #a07888;
    margin-left: auto;
    letter-spacing: 0.02em;
  }

  #canvas-wrap {
    position: fixed;
    top: 32px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    background: #fdf0f5;
  }

  #canvas-wrap.panning {
    cursor: grabbing;
  }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #connectors {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: visible;
  }

  #nodes-layer {
    position: absolute;
    top: 0;
    left: 0;
  }

  .node {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px 13px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter 0.12s ease, transform 0.12s ease;
    text-align: center;
    line-height: 1.35;
  }

  .node:hover {
    filter: brightness(0.94);
    transform: translateY(-1px);
  }

  .node:focus-visible {
    outline: 2px solid #8aabcc;
    outline-offset: 2px;
  }

  .node-label {
    font-size: 12px;
    font-weight: 500;
    color: #1a2340;
    white-space: pre-line;
    pointer-events: none;
  }

  .node-root .node-label {
    font-size: 13px;
    font-weight: 600;
  }

  .node-indicator {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #1a2340;
    font-weight: 700;
    pointer-events: none;
    line-height: 1;
    flex-shrink: 0;
  }

  #popup {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 200;
    background: #1a2340;
    color: #fff;
    max-width: 320px;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.55;
    display: none;
    box-shadow: 0 8px 32px rgba(26, 35, 64, 0.28);
  }

  #popup.visible {
    display: block;
    animation: popup-in 0.18s ease;
  }

  @keyframes popup-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #popup-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  #popup-title {
    font-size: 13px;
    font-weight: 700;
    color: #c8ddf5;
    flex: 1;
    line-height: 1.3;
    white-space: pre-line;
  }

  #popup-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
    margin-top: -1px;
  }

  #popup-close:hover {
    color: #fff;
  }

  #popup-body {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.82);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="header">
  <span id="header-title">Marketing and Strategy in Financial Organizations</span>
  <span id="header-hint">Scroll to zoom &middot; Drag to pan &middot; Click nodes to explore</span>
</div>

<div id="canvas-wrap">
  <div id="world">
    <svg id="connectors"></svg>
    <div id="nodes-layer"></div>
  </div>
</div>

<div id="popup">
  <div id="popup-header">
    <span id="popup-title"></span>
    <button id="popup-close" aria-label="Close">&times;</button>
  </div>
  <div id="popup-body"></div>
</div>

<script>
const treeData = {
  id: 'root',
  label: 'Marketing &\nStrategy in\nFinance',
  info: 'Marketing and strategy together determine how a financial organization understands its market, positions its services, and achieves long-term competitive advantage and sustainable growth.',
  color: '#dce3f5',
  children: [
    {
      id: 'l1_1', label: 'Role of Marketing', color: '#c8ddf5',
      info: 'In finance, marketing is not about promotion alone — it is the systematic process of understanding client needs, analyzing market conditions, and designing products that create lasting value.',
      children: [
        { id: 'l2_1_1', label: 'Understanding\nClient Needs', color: '#d4eaf8', info: 'Analyzing customer behavior, income levels, financial goals, and risk tolerance. This is the raw material for product design and communication strategy.', children: [] },
        { id: 'l2_1_2', label: 'Building Long-term\nRelationships', color: '#d4eaf8', info: 'Financial services are relationship businesses. Marketing builds trust through consistent communication, client education, and responsive service — reducing churn and increasing lifetime value.', children: [] },
        { id: 'l2_1_3', label: 'Positioning Services', color: '#d4eaf8', info: 'Defining how the firm’s offerings are perceived relative to competitors — on price, quality, expertise, or innovation. Clear positioning makes the firm easier for clients to choose.', children: [] }
      ]
    },
    {
      id: 'l1_2', label: 'Market\nSegmentation', color: '#c8ddf5',
      info: 'Dividing the market into distinct client groups based on shared characteristics. Without segmentation, marketing becomes a blunt instrument — expensive and ineffective.',
      children: [
        { id: 'l2_2_1', label: 'Income Level Groups', color: '#d4eaf8', info: 'Retail clients, affluent individuals, and high-net-worth clients need entirely different products: basic savings vs. portfolio management vs. private banking.', children: [] },
        { id: 'l2_2_2', label: 'Financial Goals', color: '#d4eaf8', info: 'Some clients want capital preservation; others want growth; others need liquidity. Segmenting by goal allows designing products that match actual client priorities.', children: [] },
        { id: 'l2_2_3', label: 'Risk Tolerance', color: '#d4eaf8', info: 'Conservative, moderate, and aggressive investor profiles require different asset allocations and communication styles. Mismatching risk tolerance destroys client trust.', children: [] },
        { id: 'l2_2_4', label: 'Personalized\nProducts', color: '#d4eaf8', info: 'The output of segmentation: loans tailored to SMEs, investment plans for retirement savers, FX hedging for exporters. Personalization increases conversion and client satisfaction.', children: [] }
      ]
    },
    {
      id: 'l1_3', label: 'Strategy &\nCompetitive\nAdvantage', color: '#c8ddf5',
      info: 'Strategy defines the firm’s long-term direction and how it will differentiate from rivals. Competitive advantage is the sustainable edge that makes the firm the preferred choice.',
      children: [
        { id: 'l2_3_1', label: 'Market Positioning', color: '#d4eaf8', info: 'Deciding which segments to serve, which to ignore, and how to communicate the firm’s unique value proposition to each chosen segment.', children: [] },
        { id: 'l2_3_2', label: 'Differentiation', color: '#d4eaf8', info: 'Competing on something other than price: superior digital UX, faster approvals, exclusive research, or specialized expertise. Differentiation defends margin.', children: [] },
        { id: 'l2_3_3', label: 'Pricing Strategy', color: '#d4eaf8', info: 'Setting fees that reflect value delivered, match competitive benchmarks, and cover costs with a target margin. Price signals quality in financial services.', children: [] },
        { id: 'l2_3_4', label: 'Service Quality', color: '#d4eaf8', info: 'Consistency, speed, and accuracy in delivering financial services. High service quality reduces complaints, builds referrals, and justifies premium pricing.', children: [] }
      ]
    },
    {
      id: 'l1_4', label: 'Marketing ↔\nStrategy Link', color: '#c8ddf5',
      info: 'Marketing and strategy are not separate functions — they feed each other. Marketing provides the market intelligence that strategy converts into decisions and investment.',
      children: [
        { id: 'l2_4_1', label: 'Market Trend Data', color: '#d4eaf8', info: 'Marketing research tracks demand shifts, competitor moves, and regulatory changes — providing the inputs strategy needs to allocate capital effectively.', children: [] },
        { id: 'l2_4_2', label: 'Digital Banking\nDemand', color: '#d4eaf8', info: 'A concrete example: if marketing data shows rising demand for mobile banking, strategy responds by investing in digital infrastructure and online product development.', children: [] },
        { id: 'l2_4_3', label: 'Informed Investment', color: '#d4eaf8', info: 'Capital is deployed where both market demand (from marketing) and strategic fit (from analysis) confirm opportunity — reducing wasted investment and improving returns.', children: [] }
      ]
    },
    {
      id: 'l1_5', label: 'Risks of Weak\nMarketing', color: '#c8ddf5',
      info: 'When financial firms neglect marketing, they lose touch with client needs and market changes. The consequences follow a predictable chain: poor understanding → low demand → revenue loss.',
      children: [
        { id: 'l2_5_1', label: 'Poor Client\nUnderstanding', color: '#d4eaf8', info: 'Products designed without client research miss the mark. A premium product launched to the wrong income segment generates near-zero uptake despite high production cost.', children: [] },
        { id: 'l2_5_2', label: 'Low Demand', color: '#d4eaf8', info: 'Generic products that satisfy no specific need compete only on price — a losing race against larger competitors with greater economies of scale.', children: [] },
        { id: 'l2_5_3', label: 'Reduced Trust', color: '#d4eaf8', info: 'Irrelevant or inconsistent communications erode brand trust. Once lost, trust is expensive to rebuild — often requiring rebranding or service overhauls.', children: [] },
        { id: 'l2_5_4', label: 'Revenue Loss', color: '#d4eaf8', info: 'The financial outcome: falling revenues, shrinking client base, declining market share. Competitors with stronger marketing capture the clients the firm failed to serve.', children: [] }
      ]
    }
  ]
};

// ── Constants ──────────────────────────────────────────────────────────────
const ROOT_W    = 160;
const NODE_W    = 145;
const NODE_H    = 44;
const LEAF_GAP  = 42;
const X_ROOT    = 80;
const X_STEP    = 230;
const CP_OFFSET = 80;

// ── State ──────────────────────────────────────────────────────────────────
const expanded = { root: true };
let activePopupId = null;

let panX = 0, panY = 0, scale = 1;
let isPanning = false;
let panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;

// ── Helpers ────────────────────────────────────────────────────────────────

function isExpanded(node) {
  return !!expanded[node.id];
}

function hasVisibleChildren(node) {
  return node.children && node.children.length > 0 && isExpanded(node);
}

function countLeaves(node) {
  if (!hasVisibleChildren(node)) return 1;
  return node.children.reduce(function(sum, c) { return sum + countLeaves(c); }, 0);
}

function buildLayout(root) {
  var positions = {};

  function assign(node, depth, startY) {
    var x = X_ROOT + depth * X_STEP;
    var leaves = countLeaves(node);
    var height = leaves * LEAF_GAP;
    var y = startY + height / 2;
    positions[node.id] = { x: x, y: y, node: node };

    if (hasVisibleChildren(node)) {
      var childStartY = startY;
      for (var i = 0; i < node.children.length; i++) {
        var child = node.children[i];
        var childLeaves = countLeaves(child);
        assign(child, depth + 1, childStartY);
        childStartY += childLeaves * LEAF_GAP;
      }
    }
  }

  assign(root, 0, 0);
  var totalLeaves = countLeaves(root);
  var totalHeight = totalLeaves * LEAF_GAP;
  return { positions: positions, totalHeight: totalHeight };
}

// ── Rendering ──────────────────────────────────────────────────────────────

function nodeWidth(node) {
  return node.id === 'root' ? ROOT_W : NODE_W;
}

function render() {
  var layout = buildLayout(treeData);
  var positions = layout.positions;
  var totalHeight = layout.totalHeight;

  var ids = Object.keys(positions);
  var maxX = 0;
  for (var i = 0; i < ids.length; i++) {
    var p = positions[ids[i]];
    var rx = p.x + nodeWidth(p.node) + 20;
    if (rx > maxX) maxX = rx;
  }

  var canvasH = totalHeight + LEAF_GAP;

  var svg   = document.getElementById('connectors');
  var layer = document.getElementById('nodes-layer');

  svg.setAttribute('width',  maxX + 20);
  svg.setAttribute('height', canvasH);
  svg.innerHTML = '';
  layer.innerHTML = '';

  renderSubtree(treeData, positions, svg, layer);
}

function renderSubtree(node, positions, svg, layer) {
  var pos  = positions[node.id];
  var w    = nodeWidth(node);
  var left = pos.x;
  var top  = pos.y - NODE_H / 2;

  var div = document.createElement('div');
  div.className = 'node' + (node.id === 'root' ? ' node-root' : '');
  div.dataset.id = node.id;
  div.setAttribute('tabindex', '0');
  div.setAttribute('role', 'button');
  div.setAttribute('aria-label', node.label.replace(/\n/g, ' '));
  div.style.cssText = [
    'left:' + left + 'px',
    'top:' + top + 'px',
    'width:' + w + 'px',
    'min-height:' + NODE_H + 'px',
    'background:' + node.color
  ].join(';');

  var labelSpan = document.createElement('span');
  labelSpan.className = 'node-label';
  labelSpan.textContent = node.label;
  div.appendChild(labelSpan);

  if (node.children && node.children.length > 0) {
    var ind = document.createElement('span');
    ind.className = 'node-indicator';
    ind.textContent = isExpanded(node) ? '‹' : '›';
    div.appendChild(ind);
  }

  (function(n) {
    div.addEventListener('click', function(e) { onNodeClick(n, e); });
    div.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onNodeClick(n, e); }
    });
  }(node));

  layer.appendChild(div);

  if (hasVisibleChildren(node)) {
    for (var i = 0; i < node.children.length; i++) {
      var child = node.children[i];
      var cpos  = positions[child.id];

      var x1  = pos.x + w;
      var y1  = pos.y;
      var x2  = cpos.x;
      var y2  = cpos.y;
      var cx1 = x1 + CP_OFFSET;
      var cx2 = x2 - CP_OFFSET;

      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + cx1 + ' ' + y1 + ', ' + cx2 + ' ' + y2 + ', ' + x2 + ' ' + y2);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#8aabcc');
      path.setAttribute('stroke-opacity', '0.7');
      path.setAttribute('stroke-width', '1.5');
      svg.appendChild(path);

      renderSubtree(child, positions, svg, layer);
    }
  }
}

// ── Interaction ────────────────────────────────────────────────────────────

function onNodeClick(node, e) {
  e.stopPropagation();

  if (node.children && node.children.length > 0) {
    expanded[node.id] = !expanded[node.id];
  }

  if (activePopupId === node.id) {
    hidePopup();
  } else {
    showPopup(node);
  }

  render();
}

function showPopup(node) {
  activePopupId = node.id;
  var popup = document.getElementById('popup');
  document.getElementById('popup-title').textContent = node.label;
  document.getElementById('popup-body').textContent  = node.info;
  popup.classList.add('visible');
}

function hidePopup() {
  activePopupId = null;
  document.getElementById('popup').classList.remove('visible');
}

document.getElementById('popup-close').addEventListener('click', hidePopup);

// ── Pan & Zoom ─────────────────────────────────────────────────────────────

var canvasWrap = document.getElementById('canvas-wrap');
var worldEl    = document.getElementById('world');

function applyTransform() {
  worldEl.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
}

canvasWrap.addEventListener('mousedown', function(e) {
  if (e.button !== 0) return;
  isPanning   = true;
  panStartX   = e.clientX;
  panStartY   = e.clientY;
  panOriginX  = panX;
  panOriginY  = panY;
  canvasWrap.classList.add('panning');
});

window.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  panX = panOriginX + (e.clientX - panStartX);
  panY = panOriginY + (e.clientY - panStartY);
  applyTransform();
});

window.addEventListener('mouseup', function() {
  isPanning = false;
  canvasWrap.classList.remove('panning');
});

canvasWrap.addEventListener('wheel', function(e) {
  e.preventDefault();
  var zoomFactor = e.deltaY < 0 ? 1.1 : 0.909;
  var rect = canvasWrap.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;
  panX = mx - (mx - panX) * zoomFactor;
  panY = my - (my - panY) * zoomFactor;
  scale = Math.min(3, Math.max(0.25, scale * zoomFactor));
  applyTransform();
}, { passive: false });

// Touch support
var lastTouchX = 0, lastTouchY = 0, lastTouchDist = 0;
canvasWrap.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

canvasWrap.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    panX += e.touches[0].clientX - lastTouchX;
    panY += e.touches[0].clientY - lastTouchY;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    applyTransform();
  } else if (e.touches.length === 2) {
    var dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    scale = Math.min(3, Math.max(0.25, scale * (dist / lastTouchDist)));
    lastTouchDist = dist;
    applyTransform();
  }
}, { passive: false });

// ── Init ───────────────────────────────────────────────────────────────────

function init() {
  var layout = buildLayout(treeData);
  var vpH = window.innerHeight - 32;

  panX = 20;
  panY = (vpH / 2) - (layout.totalHeight / 2);

  applyTransform();
  render();
}

window.addEventListener('resize', render);
init();
</script>
</body>
</html>
