<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance and Financial Reporting — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#c1714f;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(160,80,40,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Finance and Financial Reporting — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T={id:'root',label:'Finance and\nFinancial Reporting',info:'Financial reporting provides information about a company\'s financial position and performance. It is the foundation for informed business decisions by managers, investors, and partners.',children:[
{id:'A',label:'Role of Financial\nReporting',info:'Financial reporting serves three core purposes: evaluating how efficiently the company operates, assessing its long-term stability, and enabling informed strategic decisions.',children:[
{id:'A1',label:'Evaluate Operations',info:'Reports reveal whether the company uses its resources efficiently — comparing actual results against targets and prior periods.'},
{id:'A2',label:'Assess Stability',info:'Financial statements show whether the company can meet its obligations and withstand economic shocks — key for lenders and investors assessing credit risk.'},
{id:'A3',label:'Informed\nDecision-Making',info:'Accurate reporting allows managers to plan budgets, control costs, set targets, and develop long-term growth strategies based on real data.'},
]},
{id:'B',label:'Main Financial\nStatements',info:'Three documents form the core of financial reporting: the Income Statement (profitability), Balance Sheet (financial structure), and Cash Flow Statement (liquidity).',children:[
{id:'B1',label:'Income Statement',info:'Tracks revenue, expenses, and profit over a period. High revenue does not always mean high profit — expenses matter equally.',children:[
{id:'B1a',label:'Revenue',info:'Total income from selling goods or services before any costs are deducted. The "top line" of the income statement.'},
{id:'B1b',label:'Expenses',info:'All costs of running the business: salaries, rent, raw materials, depreciation, interest payments.'},
{id:'B1c',label:'Profit',info:'Revenue minus expenses. The "bottom line." Can be gross, operating, or net profit depending on which expenses are included.'},
]},
{id:'B2',label:'Balance Sheet',info:'A snapshot at a specific date: what the company owns (assets), owes (liabilities), and the owners\' stake (equity). Assets = Liabilities + Equity.',children:[
{id:'B2a',label:'Assets',info:'Resources the company owns: cash, inventory, equipment, property, receivables. Divided into current and non-current.'},
{id:'B2b',label:'Liabilities',info:'Obligations owed to creditors: bank loans, accounts payable, bonds. Divided into current (due within a year) and long-term.'},
{id:'B2c',label:'Equity',info:'The owners\' residual claim after all liabilities are paid. Includes share capital, retained earnings, and reserves.'},
]},
{id:'B3',label:'Cash Flow\nStatement',info:'Explains how cash actually moves in and out. A company can be profitable on paper but cash-poor in reality — this statement reveals that gap.',children:[
{id:'B3a',label:'Liquidity',info:'The ability to meet short-term obligations using available cash. Low liquidity can bankrupt even a profitable company.'},
{id:'B3b',label:'Money Movement',info:'Cash flows across three channels: Operating (day-to-day), Investing (assets), Financing (loans/dividends).'},
]},
]},
{id:'C',label:'Importance of\nFinancial Analysis',info:'Analysis interprets what the numbers mean. High revenue with high expenses signals a problem. Analysis identifies risks before they become crises.',children:[
{id:'C1',label:'Identify\nInefficiencies',info:'Analysis reveals where costs exceed benchmarks or resources are underutilized — allowing management to act before small problems become large losses.'},
{id:'C2',label:'Analyze\nPerformance',info:'Comparing results to prior periods, budgets, or industry peers using ratio analysis (ROE, ROA, current ratio) and trend analysis.'},
{id:'C3',label:'Evaluate Risks',info:'Financial data exposes credit risk, liquidity risk, and market risk (interest rate or FX exposure) before they become critical.'},
]},
{id:'D',label:'Accuracy and\nTransparency',info:'Reliable reporting requires following strict accounting standards (IFRS or GAAP) to ensure data is consistent, comparable, and free from manipulation.',children:[
{id:'D1',label:'Follow Accounting\nStandards',info:'IFRS and GAAP provide the rules for how items are recognized, measured, and disclosed — enabling cross-company comparisons.'},
{id:'D2',label:'Provide Reliable\nData',info:'Data must reflect economic reality without omitting material facts. Auditors verify this annually on behalf of shareholders.'},
{id:'D3',label:'Build Financial\nTrust',info:'Transparent reporting builds confidence among investors, banks, and partners — lowering the company\'s cost of capital.'},
{id:'D4',label:'Avoid Misleading\nUsers',info:'Incomplete or inaccurate reports lead stakeholders to wrong conclusions: investors overpay, banks overlend, managers misallocate.'},
]},
{id:'E',label:'Strategic\nDecision-Making',info:'Financial reports are the foundation of strategy. Managers use them to allocate capital, set priorities, and evaluate whether strategies are generating expected returns.',children:[
{id:'E1',label:'Plan Budgets',info:'Historical financial data provides the baseline for setting revenue targets, allocating departmental budgets, and projecting cash needs.'},
{id:'E2',label:'Control Costs',info:'Variance analysis — comparing actual costs to budget — identifies overspending early, enabling corrective action.'},
{id:'E3',label:'Develop\nStrategies',info:'Long-term plans (market entry, expansion) are grounded in financial projections derived from past performance and current position.'},
{id:'E4',label:'Assess Expected\nReturns',info:'Before investing, managers use NPV, IRR, and payback period — all based on financial report data — to determine if return justifies risk.'},
]},
]};

const open=new Set(['root','A','B','C','D','E']);
const ELS={},INFO={};

function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}

const ROW=44,COLW=220,ROOT_X=90;

function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}

function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}

function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}

let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;

function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}

function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}

const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});

function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}

function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});

window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
