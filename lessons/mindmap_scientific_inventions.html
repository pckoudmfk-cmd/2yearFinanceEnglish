<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Inventions and Technological Progress — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#3a6878;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(30,75,90,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Scientific Inventions and Technological Progress — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T = {id:'root',label:'Scientific\nInventions &\nTech Progress',info:'Scientific and technological progress drives economic transformation — creating trillion-dollar industries, disrupting incumbents, and generating vast investment opportunities for financial professionals who can analyze them.',children:[
  {id:'A',label:'Historical\nLandmark\nInventions',info:'Three transformative inventions illustrate how technology creates entire industries: Edison\'s electric light (energy sector), Bell\'s telephone (telecom), and the internal combustion engine (automotive/oil).',children:[
    {id:'A1',label:'Edison\'s Light Bulb\n(1879)',info:'Created the electric power sector, now valued at over $6 trillion globally. Investors who backed early electricity utilities captured extraordinary long-term returns.',children:[
      {id:'A1a',label:'$6T Electric\nPower Sector',info:'From a single inventor\'s workshop to a $6 trillion global industry in 140 years — the compounding power of transformative technology investment.'},
      {id:'A1b',label:'Patent\nValue',info:'Edison held over 1,000 patents. Patents convert scientific discoveries into protected financial assets — generating licensing revenue and competitive moats.'},
    ]},
    {id:'A2',label:'Bell\'s Telephone\n(1876)',info:'Launched telecommunications, now a $1.7 trillion industry. Shows how communication infrastructure becomes a regulated utility with stable, long-term cash flows.',children:[
      {id:'A2a',label:'$1.7T Telecom\nIndustry',info:'From voice calls to 5G data networks — the telephone\'s descendants generate billions in recurring subscription revenue globally.'},
      {id:'A2b',label:'Network\nEffects',info:'Communication technology becomes more valuable as more users adopt it — a financial dynamic that creates winner-take-most market structures.'},
    ]},
  ]},
  {id:'B',label:'Modern\nInnovations',info:'Current technologies creating massive investment opportunities: CRISPR biotechnology, SpaceX reusable rockets, AI in financial services, and mRNA vaccines.',children:[
    {id:'B1',label:'CRISPR-Cas9\n(2012)',info:'Gene-editing technology fueling a $100B biotechnology market expected to reach $500B by 2030. Created entirely new investment category of precision medicine.',children:[
      {id:'B1a',label:'$100B → $500B\nBiotech Market',info:'CRISPR companies trade at high revenue multiples because investors price in future therapeutic pipelines, not current sales.'},
      {id:'B1b',label:'High-Risk\nInvestment',info:'Biotech requires multi-year development, regulatory approval risk, and large upfront capital — a classic high-risk, high-return asset class.'},
    ]},
    {id:'B2',label:'SpaceX Reusable\nRockets (2015)',info:'Cut launch costs by 90%, creating a $447B space economy backed by $10B in private funds. Demonstrated how engineering innovation translates into market disruption.',children:[
      {id:'B2a',label:'90% Cost\nReduction',info:'Reusability transformed space access from a government monopoly to a competitive commercial market — the financial equivalent of commoditizing a previously bespoke service.'},
      {id:'B2b',label:'$447B Space\nEconomy',info:'Satellites, communications, Earth observation, and future lunar/Mars ventures represent a new long-duration investment frontier for institutional capital.'},
    ]},
    {id:'B3',label:'AI in Finance',info:'OpenAI and similar models enhance automated trading, fraud detection, credit scoring, and customer service — improving bank efficiency by an estimated 40%.',children:[
      {id:'B3a',label:'Automated\nTrading',info:'AI-driven quantitative strategies now execute a majority of equity market trades, compressing margins for human traders while generating returns for AI-first funds.'},
      {id:'B3b',label:'Fraud\nDetection',info:'Machine learning models analyze transaction patterns in real time, reducing fraud losses — a direct improvement to the bottom line of payment processors and banks.'},
    ]},
    {id:'B4',label:'mRNA Vaccines\n(2020)',info:'Karikó and Weissman\'s mRNA technology caused pharma shares to rise 300%, showing how breakthrough medical science translates directly into equity market returns.'},
  ]},
  {id:'C',label:'Industry\nExhibitions',info:'Trade fairs like CES, Hannover Messe, and Money20/20 serve as financial platforms where inventions meet capital — generating billions in transactions and deals.',children:[
    {id:'C1',label:'CES Las Vegas',info:'Consumer Electronics Show generates $6B in transactions annually. Innovations showcased here often predict technology sector investment themes for the following 2–3 years.'},
    {id:'C2',label:'Hannover\nMesse',info:'Industrial automation fair facilitating €10B in B2B contracts. Where industrial companies source technology partners and where institutional investors spot automation trends.'},
    {id:'C3',label:'Money20/20',info:'Fintech conference attracting venture capital and enabling mergers valued at billions. The primary venue for blockchain payments, open banking, and embedded finance dealmaking.'},
    {id:'C4',label:'Financial\nSignals',info:'Exhibition announcements often move stock prices — product launches, partnership deals, and technology previews at major trade shows are monitored by event-driven hedge funds.'},
  ]},
  {id:'D',label:'Financial\nAnalysis of\nTech Investments',info:'Evaluating technology investments requires specialized financial analysis: assessing intellectual property, predicting adoption curves, and managing innovation-specific risks.',children:[
    {id:'D1',label:'IP & Patent\nValuation',info:'Patents, trade secrets, and proprietary algorithms are intangible assets that can be valued using income approach (projected licensing revenue) or market approach (comparable transactions).'},
    {id:'D2',label:'Adoption Rate\nForecasting',info:'Technology adoption follows S-curves — slow initial growth, rapid acceleration, then saturation. Investors who correctly identify the inflection point earn the highest returns.'},
    {id:'D3',label:'Innovation\nRisk',info:'Technology investments carry regulatory risk (approval delays), obsolescence risk (a better technology emerges), and execution risk (the team cannot scale production).'},
    {id:'D4',label:'Venture Capital\n& IPO',info:'Early-stage technology companies are funded by venture capital. When mature, they access public markets via IPO — the event where early investors realize their returns.',children:[
      {id:'D4a',label:'Venture Capital',info:'High-risk equity investment in early-stage companies. VCs build diversified portfolios expecting most investments to fail but a few to generate 10–100x returns.'},
      {id:'D4b',label:'IPO Process',info:'Initial Public Offering: the company issues new shares to public investors, generating capital for growth while providing liquidity for early investors and employees.'},
    ]},
  ]},
]};

const open=new Set(['root']);
(T.children||[]).forEach(c=>open.add(c.id));

const ELS={},INFO={};
function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}
const ROW=44,COLW=220,ROOT_X=90;
function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}
function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}
function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}
let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;
function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}
function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}
const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}
function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});
window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
