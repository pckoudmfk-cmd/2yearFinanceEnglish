<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Standards and Workplace Safety — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#5a7060;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(50,75,50,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Production Standards and Workplace Safety — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T = {id:'root',label:'Production\nStandards &\nWorkplace Safety',info:'Workplace safety compliance is not just a legal obligation — it is a financial strategy. Companies that invest in prevention avoid far greater costs from accidents, sanctions, and reputational damage.',children:[
  {id:'A',label:'Financial Impact\nof Standards',info:'Following safety standards creates measurable financial value: it reduces operational risk, builds investor confidence, ensures regulatory compliance, and provides financial protection tools.',children:[
    {id:'A1',label:'Financial\nProtection Tools',info:'Insurance policies, safety bonds, and liability reserves are financial instruments that protect the company\'s balance sheet from unexpected safety-related losses.'},
    {id:'A2',label:'Operational Risk\nReduction',info:'Each prevented accident eliminates its associated direct costs (medical, legal, equipment) AND its indirect costs (downtime, retraining, reputational damage).'},
    {id:'A3',label:'Investor\nConfidence',info:'ESG-conscious investors assess safety records as a proxy for management quality. Poor safety records increase perceived governance risk and raise the cost of capital.'},
    {id:'A4',label:'Regulatory\nCompliance',info:'Meeting safety standards avoids regulatory fines, operating license suspensions, and mandatory corrective investments that disrupt production and cash flows.'},
  ]},
  {id:'B',label:'Costs of\nNon-Compliance',info:'Safety violations generate two categories of costs: direct (immediately measurable) and indirect (less visible but often larger over time).',children:[
    {id:'B1',label:'Direct Costs',info:'Immediately quantifiable financial losses resulting from a safety incident.',children:[
      {id:'B1a',label:'Medical\nCompensation',info:'Treatment costs, disability payments, and rehabilitation expenses for injured workers. Can reach millions in serious industrial accidents.'},
      {id:'B1b',label:'Equipment\nDamage',info:'Repair or replacement costs for machinery, facilities, and inventory damaged in accidents. May disrupt production for weeks or months.'},
      {id:'B1c',label:'Legal\nPenalties',info:'Court-ordered compensation to injured parties and their families, plus legal defense costs — which may exceed the original fine many times over.'},
      {id:'B1d',label:'Regulatory\nFines',info:'Sanctions imposed by labor inspectorates and safety regulators. In Russia, fines can reach 100,000–200,000 rubles per violation per incident.'},
    ]},
    {id:'B2',label:'Indirect Costs',info:'Less visible but often larger than direct costs, these accumulate over time and damage long-term financial performance.',children:[
      {id:'B2a',label:'Reputational\nDamage',info:'Media coverage of accidents reduces brand value, makes it harder to attract talent, and gives competitors an advantage in tender and procurement processes.'},
      {id:'B2b',label:'Production\nDelays',info:'Post-accident investigations and facility closures by regulators halt production, destroying revenue during the shutdown period.'},
      {id:'B2c',label:'Reduced\nProductivity',info:'Workers in unsafe environments exhibit higher absenteeism, lower morale, and reduced output even before any accident occurs — a permanent drag on margins.'},
      {id:'B2d',label:'Loss of\nClients',info:'B2B clients increasingly require safety certification audits. A poor safety record disqualifies companies from government contracts and major corporate supply chains.'},
    ]},
  ]},
  {id:'C',label:'Financial\nRisks',info:'Beyond immediate costs, safety violations create four categories of ongoing financial risk that affect the company\'s risk profile and credit rating.',children:[
    {id:'C1',label:'Sanctions',info:'Regulatory authorities may suspend operating licenses, mandate facility upgrades, or require compensatory investments — all of which consume capital and management attention.'},
    {id:'C2',label:'Increased\nInsurance\nPremiums',info:'Insurers reprice coverage after accidents, sometimes increasing premiums by 15–30% or withdrawing coverage entirely, forcing the company to self-insure.'},
    {id:'C3',label:'Capital Allocation\nChallenges',info:'Companies with poor safety records face higher borrowing costs as lenders incorporate operational risk into credit pricing — a direct cost on every loan.'},
    {id:'C4',label:'Crisis\nManagement\nCosts',info:'PR firms, crisis consultants, legal counsel, and management time diverted to managing reputational fallout represent significant unbudgeted expenditures.'},
  ]},
  {id:'D',label:'Investment\nStrategy',info:'The financially rational response to safety risk is preventive investment — which generates measurable returns by avoiding far larger reactive costs.',children:[
    {id:'D1',label:'Cost-Benefit\nAnalysis',info:'Comparing the cost of preventive investment against the probability-weighted cost of accidents. Example: $60,000 equipment upgrade vs. $170,000+ expected accident cost.'},
    {id:'D2',label:'Preventive\nInvestment',info:'Proactive spending on safety equipment, training, facility upgrades, and monitoring systems that reduces accident probability and severity.'},
    {id:'D3',label:'Long-term\nStability',info:'Companies with strong safety cultures experience lower insurance costs, better credit terms, and more stable operations — compounding advantages over time.'},
    {id:'D4',label:'Strategic\nDecision-Making',info:'Safety investment decisions should be made using the same capital allocation framework as any other investment: NPV, IRR, and risk-adjusted return analysis.'},
  ]},
  {id:'E',label:'Workplace\nViolations',info:'Common safety violations that create financial and legal exposure for companies across manufacturing, construction, and chemical industries.',children:[
    {id:'E1',label:'Lack of PPE',info:'Failure to provide personal protective equipment (gloves, helmets, respirators) is the most frequently cited violation and the easiest and cheapest to prevent.'},
    {id:'E2',label:'Outdated\nMachinery',info:'Using equipment beyond its certified service life increases accident probability and voids insurance coverage — creating uninsured liability exposure.'},
    {id:'E3',label:'Blocked\nEmergency Exits',info:'Obstructed fire exits violate fire safety codes and create catastrophic liability in the event of a fire or explosion requiring rapid evacuation.'},
    {id:'E4',label:'Poor\nVentilation',info:'Inadequate air circulation in chemical, painting, or welding environments causes occupational disease, creating long-tail medical liability claims years after exposure.'},
  ]},
]};

const open=new Set(['root']);
(T.children||[]).forEach(c=>open.add(c.id));

const ELS={},INFO={};
function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}
const ROW=44,COLW=220,ROOT_X=90;
function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}
function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}
function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}
let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;
function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}
function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}
const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}
function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});
window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
