<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Entities — Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#4a6080;overflow:hidden;height:100vh;width:100vw}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(40,60,100,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.2);padding:9px 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:.88rem;font-weight:700;color:#fff3ee;flex:1}
.btn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:4px 11px;font-size:.72rem;color:#ffe0d0;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.15)}
#wrap{position:fixed;top:42px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#wrap:active{cursor:grabbing}
svg#svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:10px;padding:6px 13px;font-size:.72rem;font-weight:500;color:#1a1a2e;text-align:center;cursor:pointer;border:1.5px solid transparent;line-height:1.35;white-space:normal;max-width:165px;transition:filter .12s}
.node:hover{filter:brightness(.93)}
.node.root{background:#dce3f5;border-color:#aab8e0;font-weight:700;font-size:.78rem;color:#0d1b3e}
.node.l1{background:#c8ddf5;border-color:#8aaed8}
.node.l2{background:#d4eaf8;border-color:#9ac0e0}
.node.l3{background:#c0edd8;border-color:#7acaaa;border-radius:20px}
.node .arr{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #aab8e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a7090;font-weight:700;pointer-events:none}
#popup{position:fixed;z-index:100;background:#1a2a42;border:1px solid #2a4060;border-radius:12px;padding:14px 16px;max-width:270px;box-shadow:0 6px 30px rgba(0,0,0,.5);display:none}
#popup.show{display:block;animation:pi .14s ease}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
#popup h3{font-size:.82rem;font-weight:700;color:#e8eaf0;margin-bottom:6px}
#popup p{font-size:.75rem;color:#9ab0cc;line-height:1.6}
#pcl{position:absolute;top:8px;right:10px;background:none;border:none;color:#6a88a8;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Business Entities — Mind Map</h1>
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <button class="btn" onclick="resetView()">Reset</button>
</header>
<div id="wrap"><svg id="svg"></svg></div>
<div id="popup"><button id="pcl" onclick="closeP()">✕</button><h3 id="pt"></h3><p id="pb"></p></div>
<script>
const T = {id:'root',label:'Business\nEntities',info:'The legal form a business chooses determines its liability exposure, tax treatment, ability to raise capital, and management structure — with profound financial consequences.',children:[
  {id:'A',label:'Sole\nProprietorship',info:'The simplest business form: one owner who controls all operations and bears unlimited personal liability. Easy to start but risky to scale.',children:[
    {id:'A1',label:'Single Owner\nControl',info:'All decisions are made by the proprietor — fast and flexible, but creates a single point of failure with no separation of management risk.'},
    {id:'A2',label:'Unlimited\nLiability',info:'The owner\'s personal assets — home, savings, car — are at risk if the business cannot pay its debts. There is no legal separation between owner and business.'},
    {id:'A3',label:'Easy\nFormation',info:'Minimal registration requirements and no corporate governance obligations make sole proprietorships the fastest way to start operating legally.'},
    {id:'A4',label:'Limited Capital\nAccess',info:'Cannot issue shares or bring in equity investors. Financing is limited to personal savings and personal loans, restricting growth potential.'},
  ]},
  {id:'B',label:'Partnership',info:'Two or more owners sharing profits, losses, management, and — in a general partnership — unlimited joint liability.',children:[
    {id:'B1',label:'General\nPartnership',info:'All partners share unlimited liability. Each partner can legally bind the firm — one partner\'s bad decision becomes every partner\'s financial obligation.',children:[
      {id:'B1a',label:'Joint Liability',info:'Creditors can pursue any partner for the full debt, regardless of that partner\'s ownership share. High personal risk for all involved.'},
      {id:'B1b',label:'Shared\nManagement',info:'All general partners typically have equal management rights unless the partnership agreement specifies otherwise.'},
    ]},
    {id:'B2',label:'Limited\nPartnership',info:'Combines general partners (who manage and bear unlimited liability) with limited partners (who invest but are shielded from liability beyond their contribution).',children:[
      {id:'B2a',label:'Limited Partner\nProtection',info:'Limited partners risk only their invested capital. They cannot participate in day-to-day management without losing their liability protection.'},
      {id:'B2b',label:'Capital\nFlexibility',info:'Allows bringing in passive investors who contribute capital without taking on management responsibilities — common in private equity and real estate.'},
    ]},
  ]},
  {id:'C',label:'Limited Liability\nCompany (LLC)',info:'Combines the liability protection of a corporation with the tax flexibility and simpler governance of a partnership. Popular for small and medium businesses.',children:[
    {id:'C1',label:'Limited Liability',info:'Members\' personal assets are protected from business debts. The most the member loses is their investment in the LLC — a fundamental advantage over sole proprietorships.'},
    {id:'C2',label:'Pass-through\nTaxation',info:'Profits and losses pass through to members\' personal tax returns, avoiding the double taxation that applies to C-corporations.'},
    {id:'C3',label:'Flexible\nManagement',info:'LLCs can be managed by members themselves or by appointed managers, and the operating agreement can be customized to fit the business needs.'},
    {id:'C4',label:'Capital\nLimitations',info:'LLCs cannot issue publicly traded shares, which restricts their ability to raise large amounts of equity capital compared to corporations.'},
  ]},
  {id:'D',label:'Corporation',info:'A separate legal entity owned by shareholders, managed by a board of directors, and capable of raising large amounts of capital through share issuance.',children:[
    {id:'D1',label:'Shareholder\nOwnership',info:'Ownership is divided into shares that can be bought, sold, and transferred. Shareholders elect the board of directors who oversee management.',children:[
      {id:'D1a',label:'Common Shares',info:'Carry voting rights and participate in dividends and residual value after all obligations are paid. Higher risk, higher potential return.'},
      {id:'D1b',label:'Preferred Shares',info:'Priority claim on dividends and assets in liquidation, but typically no voting rights. Hybrid between debt and equity in the capital structure.'},
    ]},
    {id:'D2',label:'Limited Liability',info:'Shareholders risk only their investment. Corporate debts cannot be collected from personal assets unless fraud or gross negligence is proven.'},
    {id:'D3',label:'Perpetual\nExistence',info:'A corporation continues to exist independently of ownership changes. Shares can be transferred without disrupting operations — unlike partnerships.'},
    {id:'D4',label:'Double\nTaxation',info:'Corporate profits are taxed at the corporate level; dividends paid to shareholders are taxed again at the personal level. A key disadvantage vs. pass-through entities.',children:[
      {id:'D4a',label:'Corporate Tax',info:'Tax paid by the corporation on its profits before any distribution to shareholders. Rates vary by jurisdiction.'},
      {id:'D4b',label:'Dividend Tax',info:'Shareholders pay personal income tax on dividends received, even though the underlying profits were already taxed at the corporate level.'},
    ]},
  ]},
  {id:'E',label:'Financial\nImplications',info:'The choice of business entity has direct financial consequences: it determines tax burden, liability exposure, cost of capital, and ability to attract institutional investors.',children:[
    {id:'E1',label:'Tax Structure',info:'Sole proprietorships and partnerships use pass-through taxation; C-corporations face double taxation; S-corporations and LLCs offer pass-through with liability protection.'},
    {id:'E2',label:'Capital\nRaising',info:'Only corporations can issue publicly traded equity. LLCs and partnerships must rely on private capital. The entity form determines access to institutional and retail investors.'},
    {id:'E3',label:'Liability\nProtection',info:'Corporations and LLCs create a legal wall between owner assets and business liabilities — a prerequisite for entrepreneurs seeking outside investment.'},
    {id:'E4',label:'Governance\nRequirements',info:'Public corporations face strict reporting, audit, and disclosure requirements (SEC filings, annual reports) that add cost but also build investor confidence.'},
  ]},
]};

const open=new Set(['root']);
// auto-open L1: add all direct children of root
(T.children||[]).forEach(c=>open.add(c.id));

const ELS={},INFO={};
function totalLeaves(n){if(!(n.children&&n.children.length))return 1;return n.children.reduce((a,c)=>a+totalLeaves(c),0);}
const ROW=44,COLW=220,ROOT_X=90;
function layout(node,x,y0){
  const vis=node.children||[];
  const exp=vis.length>0&&open.has(node.id);
  const nl=exp?vis.reduce((a,c)=>a+totalLeaves(c),0):1;
  INFO[node.id]={x,y:y0+nl*ROW/2,node};
  if(exp){let ky=y0;vis.forEach(c=>{const cl=totalLeaves(c)*ROW;layout(c,x+COLW,ky);ky+=cl;});}
}
function buildDOM(){
  const wrap=document.getElementById('wrap');
  function walk(node,d){
    if(!ELS[node.id]){
      const el=document.createElement('div');
      el.className='node '+(d===0?'root':d===1?'l1':d===2?'l2':'l3');
      el.id='n_'+node.id;
      el.innerHTML=node.label.replace(/\n/g,'<br>');
      if((node.children||[]).length){
        const a=document.createElement('span');
        a.className='arr';a.id='arr_'+node.id;a.textContent=open.has(node.id)?'‹':'›';el.appendChild(a);
      }
      el.addEventListener('click',e=>{e.stopPropagation();if((node.children||[]).length)toggle(node.id);showP(node,el);});
      wrap.appendChild(el);ELS[node.id]=el;
    }
    (node.children||[]).forEach(c=>walk(c,d+1));
  }
  walk(T,0);
}
function isVis(id){
  if(id==='root')return true;
  function w(n){for(const c of n.children||[]){if(c.id===id)return open.has(n.id);const r=w(c);if(r!==undefined)return r&&open.has(n.id);}}
  return !!w(T);
}
let ox=0,oy=0,sc=1,drag=false,dx=0,dy=0;
function reflow(){
  const wh=document.getElementById('wrap').clientHeight;
  const tot=totalLeaves(T)*ROW;
  layout(T,ROOT_X,(wh-tot)/2);
  Object.entries(INFO).forEach(([id,{x,y}])=>{
    const el=ELS[id];if(!el)return;
    const vis=isVis(id);el.style.display=vis?'block':'none';if(!vis)return;
    el.style.left=(x*sc+ox)+'px';el.style.top=(y*sc+oy)+'px';
    el.style.transform=`translate(0,-50%) scale(${sc})`;el.style.transformOrigin='left center';
    const a=document.getElementById('arr_'+id);if(a)a.textContent=open.has(id)?'‹':'›';
  });
  drawLines();
}
function drawLines(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  function walk(node){
    if(!isVis(node.id))return;
    const pi=INFO[node.id];if(!pi)return;
    const el=ELS[node.id];
    const nw=(el?el.offsetWidth:160)*sc;
    const px=pi.x*sc+ox+nw,py=pi.y*sc+oy;
    (node.children||[]).forEach(child=>{
      if(!isVis(child.id))return;
      const ci=INFO[child.id];if(!ci)return;
      const cx=ci.x*sc+ox,cy=ci.y*sc+oy,mx=(px+cx)/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      p.setAttribute('stroke','rgba(180,210,240,.75)');p.setAttribute('stroke-width',Math.max(1,1.3*sc));p.setAttribute('fill','none');
      svg.appendChild(p);walk(child);
    });
  }
  walk(T);
}
const wrap=document.getElementById('wrap');
wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;dx=e.clientX-ox;dy=e.clientY-oy;});
window.addEventListener('mousemove',e=>{if(!drag)return;ox=e.clientX-dx;oy=e.clientY-dy;reflow();});
window.addEventListener('mouseup',()=>drag=false);
wrap.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(2.5,Math.max(.2,sc*(e.deltaY<0?1.1:.91)));reflow();},{passive:false});
let ld=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dx=e.touches[0].clientX-ox;dy=e.touches[0].clientY-oy;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){ox=e.touches[0].clientX-dx;oy=e.touches[0].clientY-dy;reflow();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(2.5,Math.max(.2,sc*(d/ld)));ld=d;reflow();}},{passive:true});
wrap.addEventListener('touchend',()=>drag=false,{passive:true});
function toggle(id){open.has(id)?open.delete(id):open.add(id);reflow();}
function expandAll(){function w(n){open.add(n.id);(n.children||[]).forEach(w);}w(T);reflow();}
function collapseAll(){open.clear();open.add('root');reflow();}
function resetView(){sc=1;const wh=window.innerHeight-42;const tot=totalLeaves(T)*ROW;ox=40;oy=(wh-tot)/2;reflow();}
function showP(node,el){
  const pop=document.getElementById('popup');
  document.getElementById('pt').textContent=node.label.replace(/\n/g,' ');
  document.getElementById('pb').textContent=node.info||'';
  pop.style.display='block';
  const vw=window.innerWidth,vh=window.innerHeight,r=el.getBoundingClientRect();
  let lx=r.right+12,ly=r.top;
  const pw=pop.offsetWidth||270,ph=pop.offsetHeight||120;
  if(lx+pw>vw-8)lx=r.left-pw-12;if(ly+ph>vh-8)ly=vh-ph-8;if(ly<50)ly=50;
  pop.style.left=lx+'px';pop.style.top=ly+'px';pop.classList.add('show');
}
function closeP(){document.getElementById('popup').classList.remove('show');}
wrap.addEventListener('click',e=>{if(!e.target.closest('.node')&&!e.target.closest('#popup'))closeP();});
window.addEventListener('resize',reflow);
buildDOM();
resetView();
</script>
</body>
</html>
